name: Agentic RAG Eval

on:
  pull_request:
  workflow_dispatch:

jobs:
  deepeval:
    runs-on: ubuntu-latest
    env:
      PAISMART_DB_PASSWORD: changeme
      SPRING_DATA_REDIS_PASSWORD: changeme
      PAISMART_ES_SCHEME: http
      PAISMART_ES_PASSWORD: changeme
      PAISMART_MINIO_ENDPOINT: http://localhost:19000
      PAISMART_MINIO_PUBLIC_URL: http://localhost:19000
      PAISMART_MINIO_ACCESS_KEY: admin
      PAISMART_MINIO_SECRET_KEY: changeme
      PAISMART_ADMIN_PASSWORD: changeme
      PAISMART_AGENTIC_RAG_ENABLED: true
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Detect provider keys
        id: provider-keys
        shell: bash
        run: |
          if [[ -n "${DEEPSEEK_API_KEY}" && -n "${DASHSCOPE_API_KEY}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write skipped DeepEval artifacts
        if: steps.provider-keys.outputs.enabled != 'true'
        run: python eval/deepeval/run_deepeval.py

      - name: Start Docker dependencies
        if: steps.provider-keys.outputs.enabled == 'true'
        run: |
          docker compose -f docs/docker-compose.yaml up -d
          for i in {1..60}; do
            if docker exec mysql mysqladmin ping -uroot -pchangeme --silent; then
              break
            fi
            sleep 2
          done
          docker exec mysql mysql -uroot -pchangeme -e "CREATE DATABASE IF NOT EXISTS PaiSmart CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      - name: Run Java eval unit tests
        if: steps.provider-keys.outputs.enabled == 'true'
        run: mvn -B "-Dtest=RagEvalServiceTest,RagEvalAdminControllerTest,DeepSeekClientTest" test

      - name: Start backend
        if: steps.provider-keys.outputs.enabled == 'true'
        shell: bash
        run: |
          mkdir -p target/rag-eval
          mvn -B spring-boot:run > target/rag-eval/spring.log 2>&1 &
          echo $! > target/rag-eval/spring.pid
          for i in {1..90}; do
            if curl -fsS http://localhost:8081/api/v1/users/login \
              -H 'Content-Type: application/json' \
              -d '{"username":"admin","password":"changeme"}' > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat target/rag-eval/spring.log
          exit 1

      - name: Install DeepEval harness dependencies
        if: steps.provider-keys.outputs.enabled == 'true'
        run: python -m pip install -r eval/deepeval/requirements.txt

      - name: Run DeepEval offline regression
        if: steps.provider-keys.outputs.enabled == 'true'
        run: python eval/deepeval/run_deepeval.py

      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-eval-artifacts
          path: |
            target/rag-eval/deepeval-summary.json
            target/rag-eval/deepeval-cases.json
            target/rag-eval/deepeval-junit.xml
            target/rag-eval/spring.log
